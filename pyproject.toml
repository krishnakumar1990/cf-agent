[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cf-agent"
version = "1.1.0"
description = "CLI for managing AEM Content Fragments — Moveworks Marketplace"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Krishna Selvaraj" }]
keywords = ["aem", "adobe", "content-fragments", "cli", "marketplace"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]

dependencies = [
    "httpx>=0.27.0",
    "click>=8.1.0",
    # macOS ships libedit under the `readline` name, which mishandles up/down arrow
    # history in interactive prompts. gnureadline is a GNU-readline drop-in that fixes it.
    "gnureadline>=8.0.0; sys_platform == 'darwin'",
    # `asset upload` stages the file to S3 so AEM can pull it from a pre-signed URL,
    # and stores the AWS credentials in the OS keychain. These were once an optional
    # `[upload]` extra, but that just meant every user hit a missing-package error the
    # first time they ran the command — `pip install cf-agent` now covers everything.
    # keyring pulls its own platform backend (pywin32-ctypes on Windows,
    # SecretStorage/jeepney on Linux); macOS Keychain needs nothing extra.
    "boto3>=1.34.0",
    "keyring>=24.0.0",
]

[project.optional-dependencies]
# Retained so an existing `pip install 'cf-agent[upload]'` keeps working; the
# packages it used to pull are part of the base install now.
upload = []

[project.urls]
Homepage = "https://github.com/krishnakumar1990/cf-agent"
Repository = "https://github.com/krishnakumar1990/cf-agent"
Issues = "https://github.com/krishnakumar1990/cf-agent/issues"

[project.scripts]
cf-agent = "cf_agent.agent:cli"

[tool.hatch.build.targets.wheel]
packages = ["cf_agent"]
