[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cf-agent"
version = "1.0.0"
description = "CLI for managing AEM Content Fragments — Moveworks Marketplace"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "click>=8.1.0",
    # macOS ships libedit under the `readline` name, which mishandles up/down arrow
    # history in interactive prompts. gnureadline is a GNU-readline drop-in that fixes it.
    "gnureadline>=8.0.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
# Needed only for `cf-agent asset upload`, which stages the local file to S3
# so AEM can pull it from a pre-signed URL.
upload = ["boto3>=1.34.0", "keyring>=24.0.0"]

[project.scripts]
cf-agent = "cf_agent.agent:cli"

[tool.hatch.build.targets.wheel]
packages = ["cf_agent"]
